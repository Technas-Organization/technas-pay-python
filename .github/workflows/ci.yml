name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Dépôt PUBLIC : machines GitHub, gratuites et isolées. Jamais les runners ARC du cluster ici :
    # une PR venue d'un fork y exécuterait son code à côté du Nexus et de Vault (décision de
    # Jonas, 15/11/2026). Ces tests n'ont besoin de rien chez nous (faux serveurs).
    # Python 3.9 n'existe plus sur la machine GitHub la plus récente : on le teste sur Ubuntu 22.04.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", os: ubuntu-22.04 }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Construire et vérifier le paquet
        run: |
          python -m build
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for needed in ("technas_pay/AGENTS.md", "technas_pay/llms.txt", "technas_pay/py.typed"):
              assert needed in names, f"{needed} absent de {wheel}"
          print("ok", wheel)
          PY
